<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Longboard Dance Game</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<div id="loadingScreen">
    <div class="longboardLoader"></div>
    <p id="loadingText">Loading...</p>
</div>

<div id="startScreen">
    <h1>Longboard Dance Game</h1>
    <div id="startBtn" class="startBtnCSS">START GAME</div>
</div>

<canvas id="gameCanvas"></canvas>

<div id="mobileControls">
    <div class="btnGroup">
        <div class="ghostBtn" id="btnLeft">←</div>
        <div class="ghostBtn" id="btnRight">→</div>
    </div>
    <div class="btnGroup">
        <div class="ghostBtn" id="btnUp">↑</div>
        <div class="ghostBtn" id="btnDown">↓</div>
        <div class="ghostBtn" id="btnA">A</div>
        <div class="ghostBtn" id="btnS">S</div>
    </div>
</div>

<script src="game.js"></script>
</body>
</html>
